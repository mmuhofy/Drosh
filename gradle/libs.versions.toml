# Iris Shell — Version Catalog
# Single source of truth for all dependency versions.
#
# Memory Bank stack reference (§3):
#   - Kotlin 2.3.20
#   - Compose BOM 2026.04.01
#   - Hilt 2.57
#   - Room 2.8.4
#   - SSHJ 0.38.x
#   - Min SDK 26 / Target SDK 36 / Compile SDK 36
#
# NOTE: KSP version MUST match Kotlin 2.3.20 — use KSP 2.3.20-x.x.x.

[versions]
# Markdown rendering for assistant messages. Compose-native: the AST becomes
# Text, not a WebView. Built with Kotlin 2.0.20, which is older than this
# project's KGP 2.2.0, so the compiler-metadata reader has no problem with it.
# 0.45.0 is the newest release and needs Kotlin 2.4 / Compose 1.12; 0.27.0-rc02
# is the newest that ships an Android variant we can resolve.
markdownRenderer = "0.27.0-rc02"
# Real backdrop blur. 2.x is built with Kotlin 2.4 and 1.7.x with 2.3.20; this
# project is on KGP 2.2.0, whose metadata reader cannot load either. 1.6.10 is
# the newest release built with Kotlin 2.1.0.
haze = "1.6.10"
# Build tools
agp = "8.13.0"
kotlin = "2.2.0"
ksp = "2.2.0-2.0.2"

# AndroidX core
androidxCore = "1.18.0"
androidxAppCompat = "1.8.0"
androidxActivity = "1.13.0"
androidxLifecycle = "2.10.0"
androidxCoreSplashscreen = "1.2.0"
androidxDataStore = "1.2.1"
androidxSecurityCrypto = "1.1.0"
androidxBiometric = "1.1.0"
androidxWorkManager = "2.12.0"
androidxNavigation = "2.9.5"      # 2.10.0 wants compileSdk 37 + AGP 9.1; Tur 2

# Compose
composeBom = "2026.04.01"
composeMaterialIcons = "1.7.8"

# DI
# 2.58 is the ceiling on AGP 8.13. 2.59+ declares "AGP >= 8.4.0" in its own
# check but its plugin class references ScopedArtifact.POST_COMPILATION_CLASSES,
# which AGP 8.13 does not have, so it dies with a NoClassDefFoundError inside
# AGP's onVariants. 2.59.1+ additionally hard-fails demanding AGP 9.0.0.
hilt = "2.58"
hiltNavigationCompose = "1.3.0"   # 1.4.0 wants compileSdk 37; Tur 2
hiltLifecycleVmCompose = "1.3.0"
hiltWork = "1.3.0"

# Coroutines
coroutines = "1.11.0"

# Serialization
kotlinxSerialization = "1.9.0"  # 1.10+ built with Kotlin 2.3, metadata 2.4 unreadable on KGP 2.2.0

# Room
room = "2.8.5"

# Networking
# 5.4.0 is the ceiling on compileSdk 36. 5.5.0 ships minCompileSdk 37, and
# 5.0.0 was the release where Response.body became non-null — which is the
# only breaking change this codebase actually hits.
okhttp = "5.4.0"

# SSH
sshj = "0.41.1"

# Diff utilities
diffUtils = "4.12"

# Native editor — Rosemoe/sora-editor (LGPL-2.1-or-later)
# The two are pinned apart on purpose: `editor` is pure Java so it carries no
# Kotlin metadata at any version, but `language-textmate` is Kotlin and 0.24.5+
# is compiled with Kotlin 2.3.10. Measured with javap on the real artifacts:
#   language-textmate 0.24.3 -> mv=[2,2,0]  (readable by this project's KGP 2.2.0)
#   language-textmate 0.24.6 -> mv=[2,3,0]  (NOT readable — compile error)
# So no editor-bom here: the BOM would drag both to one version and reintroduce
# the 2.3 metadata. Raise language-textmate only after this project moves to a
# Kotlin that can read metadata 2.3.
soraEditor = "0.24.6"
soraLanguageTextmate = "0.24.3"
# Core library desugaring. Required by language-textmate on API < 33 — it uses
# java.time APIs that do not exist there. Version matches the one upstream docs
# prescribe for the textmate module.
desugarJdkLibs = "2.1.5"

# Image loading
coil = "3.3.0"                # 3.4+ built with Kotlin 2.3.10/2.4.0; KGP 2.2.0 reads metadata <= 2.3.0

# Animation
lottie = "6.7.1"

# Icons
lucide-ardasoyturk = "2.0.7"


# Device model codename -> marketing name. Offline, Apache-2.0.
# Pinned to 1.0.0: 1.0.10 requires compiling against SDK 37, this project is on 36.
device-marketing-names = "1.0.0"

# LLM providers — Phase 6
googleGenai = "1.73.0"

# Logging
timber = "5.0.1"

# Tests
junit = "4.13.2"
androidxTestExtJunit = "1.3.0"
androidxTestEspresso = "3.7.0"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
coroutinesTest = "1.11.0"
mockk = "1.13.14"
turbine = "1.2.0"
robolectric = "4.14.1"

# Lint
ktlint = "1.5.0"
spotless = "7.0.2"
detekt = "1.23.7"

