[package]
name = "drosh-native"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
publish = false
description = "The Drosh terminal's native half: the Ghostty VT engine, driven."

[lib]
name = "drosh"
crate-type = ["cdylib", "rlib"]

[features]
# The engine. Off means the crate is the parts that do not talk to the
# engine — the renderer's own rules — which is what the host's test run
# builds: the engine's library is built for Android and cannot be linked
# into a test binary on a build machine.
default = ["engine"]
engine = []

[dependencies]
# The JNI boundary. 0.21 is the version Android's ART is happiest with.
jni = "=0.21"
# forkpty, ioctl, waitpid: the PTY is a handful of libc calls, and the crate
# that declares them correctly is the one the platform already ships.
libc = "0.2"
log = "0.4"
# PNG frames sent through the kitty graphics protocol (f=100). The exact
# version was checked against docs.rs before use; do not float it here, a
# decoder API change is a frame that silently stops being drawn.
png = "=0.17.16"
# Shaping (ligatures, graphemes, scripts) and glyph rasterization. Both are
# pure Rust and are pinned: the glyph/position APIs are not stable across
# minor versions and the renderer depends on their exact shapes.
ab_glyph = "=0.2.32"
rustybuzz = "=0.14.0"

[build-dependencies]
# The engine's ABI is described by the headers that ship next to it. Generating
# the bindings from those headers is what keeps the two sides from drifting;
# hand-written `#[repr(C)]` structs would be right until the first upstream
# field moved.
bindgen = "0.71"

[profile.release]
# A panic across the JNI boundary is a process abort, and `panic = "abort"`
# makes that explicit rather than accidental.
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
strip = true