[package]
name = "drosh-font"
description = "Shaping (rustybuzz) and rasterisation (swash) for the bundled faces"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
log.workspace = true
rustybuzz.workspace = true
swash.workspace = true

# No `alacritty_terminal` here, deliberately: the font stack is a leaf, so its
# tests build and run without compiling the VT engine
# (`cargo test -p drosh-font`).