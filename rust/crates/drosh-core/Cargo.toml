[package]
name = "drosh-core"
description = "Drosh terminal core — the JNI boundary the Android app loads"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# cdylib: the artifact the Android app loads over JNI. The library name must
# stay `drosh_core`: Kotlin calls `System.loadLibrary("drosh_core")` and CI
# checks the APK for `lib/arm64-v8a/libdrosh_core.so`.
# rlib: lets the workspace's tests link the crate as a normal dependency.
crate-type = ["cdylib", "rlib"]

[dependencies]
drosh-bridge.workspace = true
drosh-font.workspace = true
drosh-session.workspace = true

# `ffi` reads alacritty's colour count when it marshals colours; the engine
# itself lives in drosh-session, which is what actually drives a Term.
alacritty_terminal.workspace = true
base64.workspace = true
# `JNI_OnLoad` and every `extern "system"` entry point live here — this is the
# only crate in the workspace that may depend on jni.
jni.workspace = true
log.workspace = true