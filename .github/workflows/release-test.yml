name: Build Release (Test)

on:
  workflow_dispatch:

concurrency:
  group: build-release-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release APK (no R8)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release (R8 disabled)
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PdisableR8ForDebug

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: irisshell-release-arm64-v8a-apk
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: warn
          retention-days: 30
