name: Build Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: build-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-build:
    # The library and the engine, in the layout jniLibs wants. Built by
    # native.yml so that this build, the Nightly and the Native gate all
    # compile the same recipe from the same commit.
    name: native libraries (arm64-v8a)
    uses: ./.github/workflows/native.yml
    with:
      abi: arm64-v8a
      artifact_name: drosh-jni

  nightly:
    name: Nightly APK + checksum
    needs: [native-build]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check the chroot-ng guest runtime
        env:
          CHROOT_NG_SHA256: 29473e3609c9e7692a3b9ab3613129dbdb46f9a1fa393c52b49fc601d2c7a01e
        run: |
          set -euo pipefail
          runtime="android/linux/src/main/assets/libchrootng.so"
          test -f "$runtime"
          echo "${CHROOT_NG_SHA256}  ${runtime}" | sha256sum -c -

      - name: Unpack the native libraries into jniLibs
        uses: actions/download-artifact@v4
        with:
          name: drosh-jni
          path: android/terminal/src/main/jniLibs/arm64-v8a

      - name: Check the native libraries are there
        run: |
          set -euo pipefail
          dest=android/terminal/src/main/jniLibs/arm64-v8a
          # libdrosh.so names the engine in DT_NEEDED; a missing one is a
          # session that cannot start, and nothing in the UI would say why.
          test -f "$dest/libdrosh.so"
          test -f "$dest/libghostty-vt.so"
          ls -l "$dest"

      - name: Assemble nightly
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew clean assembleRelease --no-daemon --stacktrace --parallel --max-workers=4

      - name: Generate nightly SHA-256
        working-directory: android
        run: sha256sum app/build/outputs/apk/release/app-arm64-v8a-release.apk > app/build/outputs/apk/release/drosh-nightly-arm64-v8a-release.apk.sha256

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="nightly-$(date -u +%Y%m%d)"
          APK="android/app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          SUM="android/app/build/outputs/apk/release/drosh-nightly-arm64-v8a-release.apk.sha256"
          test -f "$APK"
          if gh release view "$TAG" --repo mmuhofy/Drosh >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SUM" --repo mmuhofy/Drosh --clobber
          else
            gh release create "$TAG" "$APK" "$SUM" \
              --repo mmuhofy/Drosh --title "$TAG" --notes "Nightly build of $(git rev-parse HEAD)"
          fi
