name: Unit Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every step in this job that runs a command is a Gradle invocation, and the
    # Gradle root is android/. The action steps ignore this.
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, because the build derives its versionCode from the
          # commit count (AndroidApplicationConventionPlugin). The default is
          # fetch-depth: 1, which would make every CI build the same version —
          # and an equal versionCode is exactly what lets an older APK install
          # over a newer one and downgrade the database out from under Room.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Layer rules from docs/ARCHITECTURE.md §3. `test` does not pull this in
      # (it is wired into `check`, which CI never runs wholesale), so the gate
      # is invoked explicitly — an unenforced rule is a comment, not a rule.
      - name: Check module boundaries
        run: ./gradlew checkModuleBoundaries --no-daemon --stacktrace

      # An import that names a module the file's own module does not depend
      # on cannot compile. The Kotlin compiler says so, in a stack trace, after
      # a full round trip; this says it in one line, before that. It is the
      # other half of the boundary check: the checker looks at what a module
      # must not import, this looks at what it imports and cannot see.
      - name: Check that every module import resolves
        run: python3 ../tools/check-module-imports.py

      # A Kotlin `external fun` resolves by its fully qualified name, so a
      # moved class or a renamed function is a link error on a device and
      # nothing in the build. The engine's JNI surface was moved once without
      # the Rust side following, and the build stayed green the whole time.
      - name: Check that every JNI symbol lines up with its Kotlin declaration
        run: python3 ../tools/check-jni-symbols.py

      - name: Run :domain tests
        run: ./gradlew :domain:test --no-daemon --stacktrace

      # The agent module's tests are pure: SSE framing, tool-call reassembly,
      # request encoding and provider error classification, all driven from
      # literal wire text with no network and no Android.
      - name: Run :agent tests
        run: ./gradlew :features:agent:test --no-daemon --stacktrace

      # :terminal and :editor were never listed here, which is how a failing
      # AnsiStripperTest sat on main for months: nothing ran it. Run every
      # module that has tests, rather than appending one name at a time — the
      # next module with tests would otherwise be missed the same way.
      - name: Run remaining module tests
        run: ./gradlew test -x :domain:test -x :features:agent:test --no-daemon --stacktrace
