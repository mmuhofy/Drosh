name: Unit Tests

on:
  workflow_dispatch:
  # On every push to main as well as on pull requests: the tests are the only
  # thing that runs them, and a green APK build says nothing about whether the
  # arithmetic inside it is right. `tests.yml` used to be pull-request-only,
  # which meant direct pushes to main were never tested at all.
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every step in this job that runs a command is a Gradle invocation, and the
    # Gradle root is android/. The action steps ignore this.
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, because the build derives its versionCode from the
          # commit count (AndroidApplicationConventionPlugin). The default is
          # fetch-depth: 1, which would make every CI build the same version —
          # and an equal versionCode is exactly what lets an older APK install
          # over a newer one and downgrade the database out from under Room.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Package paths and file names are part of the architecture, but the
      # compiler does not care where a file lives. Catch a moved file whose
      # package did not follow before the Gradle round trip.
      - name: Check Kotlin layout
        working-directory: .
        run: python3 tools/check-kotlin-layout.py

      # An import that names a module the file's own module does not depend
      # on cannot compile. The Kotlin compiler says so, in a stack trace, after
      # a full round trip; this says it in one line, before that. It is the
      # other half of the boundary check: the checker looks at what a module
      # must not import, this looks at what it imports and cannot see.
      - name: Check that every module import resolves
        run: python3 ../tools/check-module-imports.py

      # A Kotlin `external fun` resolves by its fully qualified name, so a
      # moved class or a renamed function is a link error on a device and
      # nothing in the build. The engine's JNI surface was moved once without
      # the Rust side following, and the build stayed green the whole time.
      - name: Check that every JNI symbol lines up with its Kotlin declaration
        run: python3 ../tools/check-jni-symbols.py

      - name: Run the tests
        run: |
          set -euo pipefail
          # One Gradle invocation, not four — and `checkModuleBoundaries` is
          # named first because `test` does not pull it in (it is wired into
          # `check`, which CI never runs wholesale): the layer rules from
          # docs/ARCHITECTURE.md §3 are a gate only when something asks for
          # them.
          #
          # The boundary check, :domain, :features:agent and everything else
          # used to be four separate `./gradlew` calls. Each one starts a JVM,
          # configures the whole build and then stops — the configuration alone
          # is most of a minute — and the four together took longer than the
          # compilation they were guarding. Gradle runs the same tasks in one
          # build, in parallel, and a failure names its module in the log just
          # as clearly.
          ./gradlew checkModuleBoundaries test \
            --parallel --max-workers=4 --no-daemon --stacktrace

      # The native half's own rules — the renderer's colour rules, the ones
      # ported from Ghostty's renderer — are Rust, and they are tested by
      # Rust's own runner.
      #
      # Without the `engine` feature: the engine's library is built for
      # Android, and a test binary on the build machine cannot link it. The
      # rules are the part that does not need it.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run the native tests
        working-directory: native
        run: cargo test --no-default-features
