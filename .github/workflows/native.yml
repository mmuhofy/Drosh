name: Native

# Builds libdrosh.so — the Drosh terminal's native half.
#
# The library is Rust. The VT engine it drives (libghostty-vt) is somebody
# else's build: downloaded, verified, and linked as a dynamic dependency, so the
# APK carries one copy of it and this repository compiles no Zig.
#
# No local builds on dev boxes — this workflow is the only gate.

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - "tools/fetch-ghostty-vt.sh"
      - ".github/workflows/native.yml"
  pull_request:
    branches: [main]
    paths:
      - "native/**"
      - "tools/fetch-ghostty-vt.sh"
      - ".github/workflows/native.yml"
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned NDK (r28c). The engine is built by its own project with r30; the
  # API level and the two libc's agree, which is what matters for linking.
  NDK_VERSION: 28.2.13676358
  GHOSTTY_VT_VERSION: "v1.4.0"

jobs:
  native:
    name: libdrosh.so (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      # bindgen parses the engine's headers with libclang. Installing it is the
      # price of generating the bindings from the headers rather than writing
      # `#[repr(C)]` structs by hand — structs that would be right until the
      # first upstream field moved.
      - name: Install libclang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libclang-dev clang patchelf

      - name: Install pinned NDK
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"

      # The engine is somebody else's build: downloaded once, cached, and
      # verified every time it is fetched.
      - name: Cache libghostty-vt
        id: ghostty-cache
        uses: actions/cache@v4
        with:
          path: native/ghostty
          key: ghostty-vt-${{ env.GHOSTTY_VT_VERSION }}-${{ matrix.abi }}-${{ hashFiles('tools/fetch-ghostty-vt.sh') }}

      - name: Fetch and verify libghostty-vt
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        env:
          GHOSTTY_VT_ABIS: ${{ matrix.abi }}
        run: ./tools/fetch-ghostty-vt.sh

      - name: Build libdrosh.so
        working-directory: native
        env:
          DROSH_ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          cargo build --release --target aarch64-linux-android

      - name: Check the library links the engine, not a copy of it
        run: |
          set -euo pipefail
          so="native/target/aarch64-linux-android/release/libdrosh.so"
          test -f "$so"
          echo "--- NEEDED"
          readelf -d "$so" | grep -E "NEEDED|SONAME"
          # A library that does not name libghostty-vt.so is a library that
          # statically absorbed the engine — which would ship two copies of it.
          readelf -d "$so" | grep -q "libghostty-vt.so" || {
            echo "::error::libdrosh.so does not link libghostty-vt.so"
            exit 1
          }
          # The engine's own SONAME has to be the name the APK ships, or the
          # linker will look for a file that is not there.
          engine="native/ghostty/lib/${{ matrix.abi }}/libghostty-vt.so"
          readelf -d "$engine" | grep -q "SONAME.*libghostty-vt.so\]" || {
            echo "::error::libghostty-vt.so still carries its upstream soname"
            exit 1
          }

      - name: Upload the library
        uses: actions/upload-artifact@v4
        with:
          name: drosh-so-${{ matrix.abi }}
          path: native/target/aarch64-linux-android/release/libdrosh.so
          if-no-files-found: error
