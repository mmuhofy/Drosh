name: Native

# Builds libdrosh.so — the Drosh terminal's native half — and checks that it
# links the engine as a shared dependency rather than absorbing a copy of it.
#
# The build itself lives in `native-build.yml`, because the APK needs the same
# library and used to build it a second time with its own copy of these steps.
# This workflow is the gate: it runs when the Rust changed, with the targetSdk
# guard that the hot-update path depends on.
#
# The VT engine it drives (libghostty-vt) is somebody else's build: downloaded,
# verified, and linked as a dynamic dependency, so the APK carries one copy of
# it and this repository compiles no Zig.
#
# No local builds on dev boxes — this workflow is the only gate.

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - "tools/fetch-ghostty-vt.sh"
      - ".github/workflows/native.yml"
      - ".github/workflows/native-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "native/**"
      - "tools/fetch-ghostty-vt.sh"
      - ".github/workflows/native.yml"
      - ".github/workflows/native-build.yml"
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    # The ABI matrix is one entry long — the APK ships arm64-v8a only — and it
    # stays a matrix because the reusable workflow takes the ABI as an input.
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a]
    uses: ./.github/workflows/native-build.yml
    with:
      abi: ${{ matrix.abi }}
      artifact_name: drosh-jni-${{ matrix.abi }}
      guard_target_sdk: true
