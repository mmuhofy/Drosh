name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode secrets
        continue-on-error: true
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          fi

      - name: Assemble release (build cache + config cache enabled)
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace --max-workers=2
        env:
          KEYSTORE_PATH: app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Generate release SHA-256
        run: sha256sum app/build/outputs/apk/release/app-arm64-v8a-release.apk > app/build/outputs/apk/release/drosh-release-arm64-v8a-release.apk.sha256

      - name: Upload release APK + SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: drosh-release-arm64-v8a-apk
          path: |
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/drosh-release-arm64-v8a-release.apk.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
