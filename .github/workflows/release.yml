name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release APK + checksum
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, because the build derives its versionCode from the
          # commit count (AndroidApplicationConventionPlugin). The default is
          # fetch-depth: 1, which would make every CI build the same version —
          # and an equal versionCode is exactly what lets an older APK install
          # over a newer one and downgrade the database out from under Room.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # chroot-ng — the guest runtime — is not in this repository. It is built
      # and published by its own project, and the APK carries the published
      # asset. The tag pins the release; the hash pins the bytes, because the
      # build is not byte-reproducible (the debug info differs between runs), so
      # rebuilding it would not give the same file. The hash is the one in the
      # release's notes.
      #
      # A release APK without it cannot run the chroot-ng guest at all: the
      # binary is the program the guest is launched with, and a missing one is
      # an ENOENT at the first session with nothing in the UI to say why.
      - name: Check the chroot-ng guest runtime
        env:
          CHROOT_NG_SHA256: 29473e3609c9e7692a3b9ab3613129dbdb46f9a1fa393c52b49fc601d2c7a01e
        run: |
          set -euo pipefail
          # The runtime ships in the repository: it is a third-party binary that
          # does not change with our code. The hash is still checked, because
          # the bytes are the ones a release published and a build that
          # carries different ones is a build nobody can account for.
          runtime="android/linux/src/main/assets/libchrootng.so"
          test -f "$runtime"
          echo "${CHROOT_NG_SHA256}  ${runtime}" | sha256sum -c -
          ls -l "$runtime"

      - name: Decode secrets
        continue-on-error: true
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          fi

      # The keystore secrets are decoded but the build signs with the committed
      # debug key (see keystore.properties and the note in README) — a single
      # signing identity across CI and local installs. When a real release key
      # lands, wire KEYSTORE_PATH through app/build.gradle.kts so this step
      # stops being theatre.
      - name: Assemble release (build cache + config cache enabled)
        working-directory: android
        run: |
          ARGS=""
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            ARGS="-PversionName=${GITHUB_REF_NAME#v}"
            echo "Releasing versionName ${GITHUB_REF_NAME#v} (tag $GITHUB_REF_NAME)"
          else
            echo "Dispatch build without a tag — the commit-count versionName applies"
          fi
          ./gradlew clean assembleRelease $ARGS --no-daemon --stacktrace --max-workers=2
        env:
          KEYSTORE_PATH: app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # The guest runtimes travel inside the APK, and a missing one is an
      # ENOENT at the first session with nothing in the UI to say why. So the
      # release is checked for them the way the debug build is.
      - name: Check that the release carries the guest runtimes
        working-directory: android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libdrosh_core.so"
          echo "$APK contains libdrosh_core.so"
          unzip -l "$APK" | grep -q "assets/libchrootng.so"
          echo "$APK contains libchrootng.so"

      - name: Generate release SHA-256
        working-directory: android
        run: sha256sum app/build/outputs/apk/release/app-arm64-v8a-release.apk > app/build/outputs/apk/release/drosh-release-arm64-v8a-release.apk.sha256

      - name: Upload release APK + SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: drosh-release-arm64-v8a-apk
          path: |
            android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
            android/app/build/outputs/apk/release/drosh-release-arm64-v8a-release.apk.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: Extract release notes from CHANGELOG (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## / { insec = ($0 ~ "^## \\[" ver "\\]"); next }
            insec { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for [$VERSION] — add one before tagging"
            exit 1
          fi
          echo "--- notes for $VERSION ---"
          head -5 release-notes.md

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
            android/app/build/outputs/apk/release/drosh-release-arm64-v8a-release.apk.sha256
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
