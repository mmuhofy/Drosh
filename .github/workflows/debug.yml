name: Build Debug

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned NDK (r28c): the Rust engine is linked with its clang.
  NDK_VERSION: 28.2.13676358

jobs:
  rust-core:
    # Host checks plus the Android cross-check for the engine workspace.
    # No local Rust builds on dev boxes — this job is the only gate.
    name: Rust engine (fmt, clippy, test, cross-check)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Cross-check for Android target
        run: cargo check --workspace --target aarch64-linux-android

      - name: Clippy for Android target (deny warnings)
        run: cargo clippy --workspace --target aarch64-linux-android -- -D warnings

  rust-build:
    # Cross-compiles the engine's cdylib for arm64-v8a and hands it to the
    # debug job as an artifact — the .so is never committed to git.
    name: libdrosh_core.so (aarch64)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install pinned NDK
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"

      - name: Build the Rust engine for arm64-v8a
        # The NDK toolchain is wired into cargo directly (linker/CC env vars)
        # rather than through cargo-ndk, which aborts when the runner image's
        # preset ANDROID_NDK* disagree with ours.
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          cargo build --release --target aarch64-linux-android --manifest-path rust/Cargo.toml
          mkdir -p "$RUNNER_TEMP/engine-jni"
          cp rust/target/aarch64-linux-android/release/libdrosh_core.so \
            "$RUNNER_TEMP/engine-jni/"
          ls -l "$RUNNER_TEMP/engine-jni/"

      - name: Upload the core
        uses: actions/upload-artifact@v4
        with:
          name: engine-core-so
          path: ${{ runner.temp }}/engine-jni/libdrosh_core.so
          if-no-files-found: error

  native-build:
    # libdrosh.so — the Rust half that drives libghostty-vt. The APK needs it in
    # jniLibs next to the engine, and it is built here rather than downloaded so
    # the APK and the native library are always the same commit.
    name: libdrosh.so (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install libclang and patchelf
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libclang-dev clang patchelf

      - name: Install pinned NDK
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"

      - name: Fetch and verify libghostty-vt
        run: ./tools/fetch-ghostty-vt.sh

      - name: Build libdrosh.so
        working-directory: native
        env:
          DROSH_ABI: arm64-v8a
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          cargo build --release --target aarch64-linux-android

      - name: Upload the library
        uses: actions/upload-artifact@v4
        with:
          name: drosh-so
          path: native/target/aarch64-linux-android/release/libdrosh.so
          if-no-files-found: error

  debug:
    name: Debug APK
    # The native job is not a dependency yet: the new engine is not wired into
    # the app, so the APK still ships the Rust core. It runs alongside to keep
    # the Ghostty path compiling from the first commit.
    needs: [rust-build, native-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, because the build derives its versionCode from the
          # commit count (AndroidApplicationConventionPlugin). The default is
          # fetch-depth: 1, which would make every CI build the same version —
          # and an equal versionCode is exactly what lets an older APK install
          # over a newer one and downgrade the database out from under Room.
          fetch-depth: 0

      - name: Fetch the cross-built Rust core
        uses: actions/download-artifact@v4
        with:
          name: engine-core-so
          path: android/terminal/src/main/jniLibs/arm64-v8a

      # The Ghostty engine and the new native half. They are not used by the
      # app yet; carrying them now means the packaging path is proven before
      # the renderer is rewritten on top of it.
      - name: Fetch libghostty-vt
        env:
          GHOSTTY_VT_ABIS: arm64-v8a
        run: ./tools/fetch-ghostty-vt.sh

      - name: Fetch our own native half
        uses: actions/download-artifact@v4
        with:
          name: drosh-so
          path: android/terminal/src/main/jniLibs/arm64-v8a

      - name: Stage libghostty-vt into jniLibs
        run: |
          set -euo pipefail
          dest=android/terminal/src/main/jniLibs/arm64-v8a
          mkdir -p "$dest"
          cp native/ghostty/lib/arm64-v8a/libghostty-vt.so "$dest/"
          # The engine must be there, and it must be the name the linker asks
          # for: libdrosh.so names it in DT_NEEDED.
          test -f "$dest/libghostty-vt.so"
          test -f "$dest/libdrosh.so"
          readelf -d "$dest/libdrosh.so" | grep -q "libghostty-vt.so" || {
            echo "::error::libdrosh.so does not link libghostty-vt.so"
            exit 1
          }
          ls -l "$dest"

      # chroot-ng — the guest runtime — is not in this repository. It is built
      # and published by its own project, and the APK carries the published
      # asset. The tag pins the release; the hash pins the bytes, because the
      # build is not byte-reproducible (the debug info differs between runs), so
      # rebuilding it would not give the same file. The hash is the one in the
      # release's notes.
      - name: Check the chroot-ng guest runtime
        env:
          CHROOT_NG_SHA256: 29473e3609c9e7692a3b9ab3613129dbdb46f9a1fa393c52b49fc601d2c7a01e
        run: |
          set -euo pipefail
          # The runtime ships in the repository: it is a third-party binary that
          # does not change with our code. The hash is still checked, because
          # the bytes are the ones a release published and a build that
          # carries different ones is a build nobody can account for.
          runtime="android/linux/src/main/assets/libchrootng.so"
          test -f "$runtime"
          echo "${CHROOT_NG_SHA256}  ${runtime}" | sha256sum -c -
          ls -l "$runtime"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace --max-workers=2

      # The identity hash in the migration is a hand-copied constant, and a stale
      # one is invisible here: the build passes and the app crashes on first
      # launch with "Room cannot verify the data integrity". Room writes the real
      # hash to android/data/schemas/ during the build, so exporting here and
      # diffing turns a device crash into a red build. This step runs from the
      # repository root, so the pathspecs carry the `android/` prefix.
      - name: Check Room schema matches the committed snapshot
        run: |
          if ! git diff --quiet -- android/data/schemas ||              [ -n "$(git ls-files --others --exclude-standard -- android/data/schemas)" ]; then
            echo "::error::The Room schema in android/data/schemas does not match the committed"
            echo "::error::snapshot. If you changed a @Entity, also update"
            echo "::error::DroshDatabase.IDENTITY_HASH — a stale hash builds clean and"
            echo "::error::crashes on first launch with 'Room cannot verify data"
            echo "::error::integrity'."
            git status --porcelain -- android/data/schemas
            find android/data/schemas -name "*.json" -exec cat {} \;
            exit 1
          fi

      - name: Upload Room schema on mismatch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-mismatch
          path: android/data/schemas
          if-no-files-found: warn

      # An APK without the .so starts and dies on System.loadLibrary; fail
      # here instead of on the device.
      - name: Check the APK carries the engine core
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libdrosh_core.so"
          echo "$APK contains libdrosh_core.so"
          unzip -l "$APK" | grep -q "assets/libchrootng.so"
          echo "$APK contains libchrootng.so"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: drosh-debug-arm64-v8a-apk
          path: android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: warn
          retention-days: 14
