name: Build Debug

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned NDK (r28c): the Rust engine is linked with its clang.
  NDK_VERSION: 28.2.13676358

jobs:
  rust-core:
    # Host checks plus the Android cross-check for the engine workspace.
    # No local Rust builds on dev boxes — this job is the only gate.
    name: Rust engine (fmt, clippy, test, cross-check)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: engine/rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine/rust

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Cross-check for Android target
        run: cargo check --workspace --target aarch64-linux-android

      - name: Clippy for Android target (deny warnings)
        run: cargo clippy --workspace --target aarch64-linux-android -- -D warnings

  rust-build:
    # Cross-compiles the engine's cdylib for arm64-v8a and hands it to the
    # debug job as an artifact — the .so is never committed to git.
    name: libdrosh_core.so (aarch64)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine/rust

      - name: Install pinned NDK
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"

      - name: Build the Rust engine for arm64-v8a
        # The NDK toolchain is wired into cargo directly (linker/CC env vars)
        # rather than through cargo-ndk, which aborts when the runner image's
        # preset ANDROID_NDK* disagree with ours.
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          cargo build --release --target aarch64-linux-android --manifest-path engine/rust/Cargo.toml
          mkdir -p "$RUNNER_TEMP/engine-jni"
          cp engine/rust/target/aarch64-linux-android/release/libdrosh_core.so \
            "$RUNNER_TEMP/engine-jni/"
          ls -l "$RUNNER_TEMP/engine-jni/"

      - name: Upload the core
        uses: actions/upload-artifact@v4
        with:
          name: engine-core-so
          path: ${{ runner.temp }}/engine-jni/libdrosh_core.so
          if-no-files-found: error

  debug:
    name: Debug APK
    needs: rust-build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, because the build derives its versionCode from the
          # commit count (AndroidApplicationConventionPlugin). The default is
          # fetch-depth: 1, which would make every CI build the same version —
          # and an equal versionCode is exactly what lets an older APK install
          # over a newer one and downgrade the database out from under Room.
          fetch-depth: 0
          # chroot-ng lives in its own repo (mmuhofy/chroot-ng) and is pulled in
          # as a submodule so its source is present for the P4 guest build.
          submodules: true

      - name: Fetch the cross-built Rust core
        uses: actions/download-artifact@v4
        with:
          name: engine-core-so
          path: engine/src/main/jniLibs/arm64-v8a

      # chroot-ng lives in its own repo (mmuhofy/chroot-ng) and is pulled in as a
      # submodule. Cross-build it for arm64-v8a and drop the static ELF (renamed
      # libchrootng.so so the APK's native-lib extractor places it in the app's
      # nativeLibraryDir with exec permission) into terminal's jniLibs.
      - name: Build chroot-ng guest (aarch64)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          make -C engine/rust/chroot-ng CROSS=aarch64-linux-gnu-
          mkdir -p terminal/src/main/jniLibs/arm64-v8a
          cp engine/rust/chroot-ng/build/chroot-ng \
            terminal/src/main/jniLibs/arm64-v8a/libchrootng.so
          ls -l terminal/src/main/jniLibs/arm64-v8a/libchrootng.so

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace --max-workers=2

      # The identity hash in the migration is a hand-copied constant, and a stale
      # one is invisible here: the build passes and the app crashes on first
      # launch with "Room cannot verify the data integrity". Room writes the real
      # hash to data/schemas/ during the build, so exporting here and diffing
      # turns a device crash into a red build.
      - name: Check Room schema matches the committed snapshot
        run: |
          if ! git diff --quiet -- data/schemas ||              [ -n "$(git ls-files --others --exclude-standard -- data/schemas)" ]; then
            echo "::error::The Room schema in data/schemas does not match the committed"
            echo "::error::snapshot. If you changed a @Entity, also update"
            echo "::error::DroshDatabase.IDENTITY_HASH — a stale hash builds clean and"
            echo "::error::crashes on first launch with 'Room cannot verify data"
            echo "::error::integrity'."
            git status --porcelain -- data/schemas
            find data/schemas -name "*.json" -exec cat {} \;
            exit 1
          fi

      - name: Upload Room schema on mismatch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-mismatch
          path: data/schemas
          if-no-files-found: warn

      # An APK without the .so starts and dies on System.loadLibrary; fail
      # here instead of on the device.
      - name: Check the APK carries the engine core
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libdrosh_core.so"
          echo "$APK contains libdrosh_core.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libchrootng.so"
          echo "$APK contains libchrootng.so"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: drosh-debug-arm64-v8a-apk
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: warn
          retention-days: 14
