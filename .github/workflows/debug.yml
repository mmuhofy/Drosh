name: Build Debug

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

# Writing the debug APK to a release needs to create a release and upload to
# it. Everything else in this workflow is read-only.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Pinned NDK (r28c): the Rust engine is linked with its clang.
  NDK_VERSION: 28.2.13676358

jobs:
  rust-core:
    # Host checks plus the Android cross-check for the engine workspace.
    # No local Rust builds on dev boxes — this job is the only gate.
    name: Rust engine (fmt, clippy, test, cross-check)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Cross-check for Android target
        run: cargo check --workspace --target aarch64-linux-android

      - name: Clippy for Android target (deny warnings)
        run: cargo clippy --workspace --target aarch64-linux-android -- -D warnings

  debug:
    # The engine's cdylib is built in this same job rather than handed over as
    # an artifact.
    #
    # It used to be two jobs: one cross-compiled `libdrosh_core.so` and uploaded
    # it, the next downloaded it and assembled the APK. That is the tidier
    # shape, and it stopped working — artifact storage has a quota, and when the
    # quota is hit `upload-artifact` fails and the APK job is skipped entirely.
    # A build that cannot run because a *storage* limit was reached is a build
    # that reports the wrong thing: nothing about the code changed, and the only
    # way to find out is to read the upload step's log.
    #
    # One job has no artifact in the middle. The .so goes from cargo's output
    # straight into `jniLibs` and then into the APK.
    name: Debug APK
    needs: rust-core
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, because the build derives its versionCode from the
          # commit count (AndroidApplicationConventionPlugin). The default is
          # fetch-depth: 1, which would make every CI build the same version —
          # and an equal versionCode is exactly what lets an older APK install
          # over a newer one and downgrade the database out from under Room.
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install pinned NDK
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"

      - name: Build the Rust engine for arm64-v8a
        # The NDK toolchain is wired into cargo directly (linker/CC env vars)
        # rather than through cargo-ndk, which aborts when the runner image's
        # preset ANDROID_NDK* disagree with ours.
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          cargo build --release --target aarch64-linux-android --manifest-path rust/Cargo.toml

          # Straight into the app's native library folder: no artifact, no
          # download step, nothing to lose to a storage quota.
          mkdir -p android/terminal/src/main/jniLibs/arm64-v8a
          cp rust/target/aarch64-linux-android/release/libdrosh_core.so \
            android/terminal/src/main/jniLibs/arm64-v8a/
          ls -l android/terminal/src/main/jniLibs/arm64-v8a/

      # chroot-ng — the guest runtime — is not in this repository. It is built
      # and published by its own project, and the APK carries the published
      # asset. The tag pins the release; the hash pins the bytes, because the
      # build is not byte-reproducible (the debug info differs between runs), so
      # rebuilding it would not give the same file. The hash is the one in the
      # release's notes.
      - name: Check the chroot-ng guest runtime
        env:
          CHROOT_NG_SHA256: 29473e3609c9e7692a3b9ab3613129dbdb46f9a1fa393c52b49fc601d2c7a01e
        run: |
          set -euo pipefail
          # The runtime ships in the repository: it is a third-party binary that
          # does not change with our code. The hash is still checked, because
          # the bytes are the ones a release published and a build that
          # carries different ones is a build nobody can account for.
          runtime="android/linux/src/main/assets/libchrootng.so"
          test -f "$runtime"
          echo "${CHROOT_NG_SHA256}  ${runtime}" | sha256sum -c -
          ls -l "$runtime"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace --max-workers=2

      # The identity hash in the migration is a hand-copied constant, and a stale
      # one is invisible here: the build passes and the app crashes on first
      # launch with "Room cannot verify the data integrity". Room writes the real
      # hash to android/data/schemas/ during the build, so exporting here and
      # diffing turns a device crash into a red build. This step runs from the
      # repository root, so the pathspecs carry the `android/` prefix.
      - name: Check Room schema matches the committed snapshot
        run: |
          if ! git diff --quiet -- android/data/schemas ||              [ -n "$(git ls-files --others --exclude-standard -- android/data/schemas)" ]; then
            echo "::error::The Room schema in android/data/schemas does not match the committed"
            echo "::error::snapshot. If you changed a @Entity, also update"
            echo "::error::DroshDatabase.IDENTITY_HASH — a stale hash builds clean and"
            echo "::error::crashes on first launch with 'Room cannot verify data"
            echo "::error::integrity'."
            git status --porcelain -- android/data/schemas
            find android/data/schemas -name "*.json" -exec cat {} \;
            exit 1
          fi

      # An APK without the .so starts and dies on System.loadLibrary; fail
      # here instead of on the device.
      - name: Check the APK carries the engine core
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libdrosh_core.so"
          echo "$APK contains libdrosh_core.so"
          unzip -l "$APK" | grep -q "assets/libchrootng.so"
          echo "$APK contains libchrootng.so"

      # The APK is published as a release asset, not an artifact.
      #
      # Artifact storage has a quota and it does run out; when it does, every
      # upload fails and the build that produces the thing the user installs is
      # the one that disappears. Release assets are a different budget and a
      # different lifetime, and the tag is fixed, so each build replaces the
      # same three files rather than accumulating one per run.
      #
      # `main-latest` is a moving pre-release: it is not a version anybody
      # should pin, it is the newest build off `main`, which is what a device
      # test wants.
      - name: Publish the debug APK as a release asset
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK" drosh-debug-arm64-v8a.apk
          sha256sum drosh-debug-arm64-v8a.apk > drosh-debug-arm64-v8a.apk.sha256

          TAG=main-latest
          # Create the moving release once; afterwards only its assets change.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "Latest debug build (main)" \
              --notes "The newest debug APK built from main. Not a version to pin: it is replaced on every push."

          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            drosh-debug-arm64-v8a.apk \
            drosh-debug-arm64-v8a.apk.sha256

          echo "Published to https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
