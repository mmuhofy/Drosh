name: Build Debug

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    # libdrosh.so and libghostty-vt.so, in the layout jniLibs wants. They are
    # built by native-build.yml — the same workflow the Native gate runs — so
    # the APK and the standalone build are one recipe and one commit. This job
    # restores the library from a cache keyed on the Rust sources, the engine
    # script and the NDK, so a change that only touched Kotlin takes seconds.
    name: native libraries (arm64-v8a)
    uses: ./.github/workflows/native-build.yml
    with:
      abi: arm64-v8a
      artifact_name: drosh-jni

  debug:
    name: Debug APK
    needs: [native-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, because the build derives its versionCode from the
          # commit count (AndroidApplicationConventionPlugin). The default is
          # fetch-depth: 1, which would make every CI build the same version —
          # and an equal versionCode is exactly what lets an older APK install
          # over a newer one and downgrade the database out from under Room.
          fetch-depth: 0

      - name: Unpack the native libraries into jniLibs
        uses: actions/download-artifact@v4
        with:
          name: drosh-jni
          path: android/terminal/src/main/jniLibs/arm64-v8a

      - name: Check the native libraries are the ones the linker asks for
        run: |
          set -euo pipefail
          dest=android/terminal/src/main/jniLibs/arm64-v8a
          # Both halves must be there, under the names that matter: libdrosh.so
          # names the engine in DT_NEEDED, so a missing or renamed engine is a
          # session that cannot start.
          test -f "$dest/libghostty-vt.so"
          test -f "$dest/libdrosh.so"
          # The output goes to a file first. A pipe into `grep -q` is a race:
          # grep exits at the first match, readelf takes a SIGPIPE, and with
          # `pipefail` the pipeline reports the failure of a check that
          # actually passed. The build failed on a library that linked the
          # engine perfectly well.
          readelf -d "$dest/libdrosh.so" > "$RUNNER_TEMP/libdrosh.dynamic"
          if ! grep -q "libghostty-vt.so" "$RUNNER_TEMP/libdrosh.dynamic"; then
            echo "::error::libdrosh.so does not link libghostty-vt.so"
            cat "$RUNNER_TEMP/libdrosh.dynamic"
            exit 1
          fi
          ls -l "$dest"

      # chroot-ng — the guest runtime — is not in this repository. It is built
      # and published by its own project, and the APK carries the published
      # asset. The tag pins the release; the hash pins the bytes, because the
      # build is not byte-reproducible (the debug info differs between runs), so
      # rebuilding it would not give the same file. The hash is the one in the
      # release's notes.
      - name: Check the chroot-ng guest runtime
        env:
          CHROOT_NG_SHA256: 29473e3609c9e7692a3b9ab3613129dbdb46f9a1fa393c52b49fc601d2c7a01e
        run: |
          set -euo pipefail
          # The runtime ships in the repository: it is a third-party binary that
          # does not change with our code. The hash is still checked, because
          # the bytes are the ones a release published and a build that
          # carries different ones is a build nobody can account for.
          runtime="android/linux/src/main/assets/libchrootng.so"
          test -f "$runtime"
          echo "${CHROOT_NG_SHA256}  ${runtime}" | sha256sum -c -
          ls -l "$runtime"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        working-directory: android
        # --parallel and the full worker count: the runner has four cores, and
        # Kotlin compilation of the feature modules is the long pole. Capping
        # the workers at two was leaving two of them idle.
        run: ./gradlew assembleDebug --no-daemon --stacktrace --parallel --max-workers=4

      # The identity hash in the migration is a hand-copied constant, and a stale
      # one is invisible here: the build passes and the app crashes on first
      # launch with "Room cannot verify the data integrity". Room writes the real
      # hash to android/data/schemas/ during the build, so exporting here and
      # diffing turns a device crash into a red build. This step runs from the
      # repository root, so the pathspecs carry the `android/` prefix.
      - name: Check Room schema matches the committed snapshot
        run: |
          if ! git diff --quiet -- android/data/schemas ||              [ -n "$(git ls-files --others --exclude-standard -- android/data/schemas)" ]; then
            echo "::error::The Room schema in android/data/schemas does not match the committed"
            echo "::error::snapshot. If you changed a @Entity, also update"
            echo "::error::DroshDatabase.IDENTITY_HASH — a stale hash builds clean and"
            echo "::error::crashes on first launch with 'Room cannot verify data"
            echo "::error::integrity'."
            git status --porcelain -- android/data/schemas
            find android/data/schemas -name "*.json" -exec cat {} \;
            exit 1
          fi

      - name: Upload Room schema on mismatch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-mismatch
          path: android/data/schemas
          if-no-files-found: warn
          retention-days: 1

      # The guest runtime travels inside the APK, and a missing one is an
      # ENOENT at the first session with nothing in the UI to say why. Fail
      # here instead of on the device.
      - name: Check the APK carries the guest runtime
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          unzip -l "$APK" | grep -q "assets/libchrootng.so"
          echo "$APK contains libchrootng.so"

      # Pull requests (especially from forks) cannot use the private-repo
      # secret, so their APK stays a short-lived Actions artifact. Branch and
      # dispatch builds go to the private repo instead: a public repo's
      # artifacts are downloadable by anyone with read access.
      - name: Upload debug APK (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: drosh-debug-arm64-v8a-apk
          path: android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: warn
          retention-days: 1

      - name: Publish debug APK to the private build repo
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RELEASE_TOKEN }}
          PRIVATE_REPO: mmuhofy/Drosh-builds
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk"
          SUM="android/app/build/outputs/apk/debug/drosh-debug-arm64-v8a-debug.apk.sha256"
          test -f "$APK"
          sha256sum "$APK" > "$SUM"
          TAG="debug-${GITHUB_SHA::7}"
          NOTES="Debug build of ${GITHUB_SHA} (${GITHUB_REF_NAME})"
          if gh release view "$TAG" --repo "$PRIVATE_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SUM" --repo "$PRIVATE_REPO" --clobber
          else
            gh release create "$TAG" "$APK" "$SUM" \
              --repo "$PRIVATE_REPO" --title "$TAG" --notes "$NOTES"
          fi
