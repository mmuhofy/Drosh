name: Prune old workflow runs

on:
  schedule:
    # Schedule workflows only run on the default branch, so this starts after
    # the change lands on main. Daily is enough for a 100-run ceiling.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  prune:
    name: Keep the newest 100 runs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Delete runs beyond the newest 100
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          KEEP: '100'
        run: |
          set -euo pipefail

          # The runs endpoint returns newest first. Paginate, take the first
          # KEEP ids, delete the rest — deleting a run also removes its logs
          # and its artifacts, which is the point.
          mapfile -t ids < <(
            gh api "repos/${GH_REPO}/actions/runs?per_page=100" \
              --paginate --jq '.workflow_runs[].id'
          )

          total=${#ids[@]}
          if (( total <= KEEP )); then
            echo "$total runs, nothing to prune"
            exit 0
          fi

          echo "$total runs, keeping $KEEP, deleting $((total - KEEP))"
          deleted=0
          for id in "${ids[@]:KEEP}"; do
            gh api -X DELETE "repos/${GH_REPO}/actions/runs/${id}" >/dev/null
            deleted=$((deleted + 1))
          done
          echo "deleted $deleted runs"
