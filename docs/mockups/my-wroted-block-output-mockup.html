<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drosh - Polish HUD Terminal UI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@500;600&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0');

    :root {
      --bg: #0c0c0e;
      --card-bg: #151518;
      --border-color: #282832; /* Net ve kaliteli gri çerçeve */
      --text-main: #e6e6ed;
      --text-muted: #6e6e7d;
      --accent-green: #00e676;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      padding: 20px 16px;
      display: flex;
      justify-content: center;
    }

    .terminal-container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .connected-session {
      display: flex;
      flex-direction: column;
    }

    /* DÖRT TARAFI BORDER'LI KART */
    .system-status-card {
      background-color: var(--card-bg);
      /* Dört tarafı da tam border */
      border: 1px solid var(--border-color); 
      border-radius: 10px 10px 0 0;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .metrics-group { 
      display: flex; 
      gap: 12px; 
      align-items: center; 
    }

    .metric-item { 
      display: flex; 
      align-items: center; 
      gap: 4px; 
      font-size: 0.75rem; 
    }

    .metric-label { color: var(--text-muted); font-weight: 600; }
    .metric-value { color: var(--accent-green); font-family: var(--font-mono); font-weight: 700; }
    
    /* Rozetler (Exit status & Time) */
    .badge {
      background-color: rgba(0, 230, 118, 0.1);
      color: var(--accent-green);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-family: var(--font-mono);
      font-weight: 700;
    }

    .time-badge {
      color: var(--text-muted);
      font-size: 0.73rem;
      font-family: var(--font-mono);
    }

    .card-actions { 
      display: flex; 
      gap: 12px; 
      color: var(--text-muted); 
      align-items: center; 
    }

    .action-icon { 
      font-size: 18px !important; 
      cursor: pointer; 
      transition: all 0.2s; 
    }

    .action-icon:hover { color: #fff; }

    .toggle-btn.closed {
      transform: rotate(-90deg);
    }

    /* KARTIN ALTINDAN DEVAM EDEN ÇERÇEVE */
    .connected-content {
      border-left: 1px solid var(--border-color); 
      border-right: 1px solid var(--border-color);
      /* Kartın alt border'ı olduğu için üstten border eklemeyip kartla birleştiriyoruz */
      margin-top: -1px; 
      background-color: rgba(21, 21, 24, 0.2);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-row {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.5;
      word-break: break-all;
    }

    .prompt { color: #e2e57b; font-weight: 700; margin-right: 6px; }
    .command { color: #fff; }

    /* Çıktı Alanı */
    .output-row {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      display: flex;
      gap: 12px;
      color: #a0a0b0;
      transition: all 0.2s ease-in-out;
    }

    .output-row.hidden-output {
      display: none;
    }

    .dir { color: #fff; font-weight: 700; }
    .hidden-file { color: #6272a4; }
  </style>
</head>
<body>

  <div class="terminal-container">
    
    <div class="connected-session">
      <!-- Dört Taraflı Kart (HUD) -->
      <div class="system-status-card">
        <div class="metrics-group">
          <!-- 1. Süreç Durumu -->
          <span class="badge">Exit 0</span>
          <!-- 2. Çalışma Süresi -->
          <span class="time-badge">⏱ 340ms</span>
          <!-- 3. CPU/RAM -->
          <div class="metric-item" style="margin-left: 4px;">
            <span class="metric-label">CPU</span>
            <span class="metric-value">12%</span>
          </div>
        </div>

        <!-- Aksiyonlar & Aç-Kapa Butonu -->
        <div class="card-actions">
          <span class="material-symbols-outlined action-icon" title="Copy">content_copy</span>
          <span id="toggleBtn" class="material-symbols-outlined action-icon toggle-btn" onclick="toggleOutput()" title="Toggle Output">expand_more</span>
        </div>
      </div>

      <!-- Bağlantılı Terminal Akışı -->
      <div class="connected-content">
        <div class="input-row">
          <span class="prompt">root@drosh:~$</span><span class="command">find / -type f -exec du -Sh {} + 2>/dev/null | sort -rh | head -n 10</span>
        </div>
        
        <div id="outputRow" class="output-row">
          <span class="dir">projects</span>
          <span class="hidden-file">.zshrc</span>
          <span class="hidden-file">.oh-my-zsh</span>
        </div>
      </div>

    </div>

  </div>

  <script>
    function toggleOutput() {
      const output = document.getElementById('outputRow');
      const btn = document.getElementById('toggleBtn');
      
      output.classList.toggle('hidden-output');
      btn.classList.toggle('closed');
    }
  </script>
</body>
</html>
